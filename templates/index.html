<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Apply Smart</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #d9ead3; /* pastel green */
      color: #555555; /* grey */
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #f0f0f0; /* light grey background */
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #38755b; /* darker pastel green */
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    a.button {
      background: #a9c6a6; /* pastel green */
      color: #333333;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: 600;
      margin: 0 10px;
      display: inline-block;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background: #8fae8b;
      color: #222222;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Apply Smart</h1>
    <p>Your streamlined student application portal.</p>
    <a href="{{ url_for('login') }}" class="button">Sign In</a>
    <a href="{{ url_for('signup') }}" class="button">Sign Up</a>
  </div>
</body>
</html>
