<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Apply Smart</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #cdeecd, #e0f7da); /* soft pastel gradient */
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 900px;
      width: 95%;
      display: flex;
      overflow: hidden;
    }

    .left {
      flex: 1;
      background: url('https://cdn.24.co.za/files/Cms/General/d/8226/be62e51a14294958823186fff96d27e4.jpg') no-repeat center center/cover;
    }

    .right {
      flex: 1;
      padding: 60px 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      color: #38755b;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 40px;
    }

    .buttons a {
      background: #a9c6a6;
      color: #333;
      text-decoration: none;
      padding: 14px 30px;
      border-radius: 8px;
      font-weight: 600;
      margin: 10px;
      display: inline-block;
      transition: background 0.3s ease;
    }

    .buttons a:hover {
      background: #8fae8b;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left"></div>
    <div class="right">
      <h1>Welcome to Apply Smart</h1>
      <p>Plan your future and apply to top universities with confidence.</p>
      <div class="buttons">
        <a href="{{ url_for('login') }}">Sign In</a>
        <a href="{{ url_for('signup') }}">Sign Up</a>
      </div>
    </div>
  </div>
</body>
</html>
